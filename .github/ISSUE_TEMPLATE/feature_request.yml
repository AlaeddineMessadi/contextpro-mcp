name: Feature request
description: A concrete coding-agent workflow that ContextPro could improve
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is difficult today? Give a concrete example and current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and tradeoffs
      description: Describe useful output, correctness requirements and likely token, latency or maintenance costs.
    validations:
      required: true
