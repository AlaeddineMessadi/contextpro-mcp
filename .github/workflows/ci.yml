name: CI

# No push-to-main trigger: the PR run already tested the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Node ${{ matrix.node }})
    # Drafts skip CI; marking the PR ready for review triggers the run.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Engine floor and the recommended LTS. macOS is left out to keep the
        # matrix small.
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install benchmark prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=4 test/main/*.test.mjs
      - run: npm run docs:check
      - run: npm run release:check
      - run: npm run pack:check
      - name: Validate workflow syntax
        if: matrix.node == 24
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
