name: CI

# No push-to-main trigger: the PR run already tested the merge commit, and a
# second run per merge doubled the private-repo Actions minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Node ${{ matrix.node }})
    # Drafts skip CI; marking the PR ready for review triggers the run.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Engine floor and the recommended LTS. macOS is left out because its
        # minutes bill at 10x.
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install benchmark prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=4 test/main/*.test.mjs
      - run: npm run docs:check
      - run: npm run release:check
      - run: npm run pack:check
      - name: Validate workflow syntax
        if: matrix.node == 24
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  apps:
    name: App (${{ matrix.app }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [landing, dashboard]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run test --if-present
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
